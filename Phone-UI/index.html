<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#000000">
    <title>iOS Setup</title>

    <link rel="preload" as="image" href="../assets/Phone-UI/apple_logo.jpg">
    <link rel="preload" as="image" href="../assets/Phone-UI/ios-wallpaper.svg">
    <link rel="stylesheet" href="../node_modules/framework7/framework7-bundle.min.css">
    <link rel="stylesheet" href="../node_modules/framework7-icons/css/framework7-icons.css">
    <link rel="stylesheet" href="./main.css">

    <script src="../node_modules/framework7/framework7-bundle.min.js" defer></script>
    <script src="./ios-boot-core.js?v=20260809-3" defer></script>
    <script src="./app.js?v=20260809-3" defer></script>
  </head>
  <body data-phase="boot">
    <div class="device-stage">
      <div class="iphone-frame">
        <div class="dynamic-island" aria-hidden="true"></div>

        <div id="ios-app" class="ios-app framework7-root" data-phase="boot">
          <main class="app-host" aria-label="iOS setup">
            <section class="desktop-screen safe-area-layer" data-desktop-screen aria-hidden="true">
              <img
                class="desktop-wallpaper"
                src="../assets/Phone-UI/ios-wallpaper.svg"
                alt=""
                draggable="false"
              >
              <article class="card glass-surface development-card" data-development-card tabindex="-1">
                <div class="card-content card-content-padding">
                  <p class="development-card__eyebrow">iOS</p>
                  <h1>Under Development</h1>
                  <p>System components and application environments are currently being compiled.</p>
                </div>
              </article>
            </section>

            <section
              class="welcome-screen safe-area-layer"
              data-welcome-screen
              role="button"
              aria-label="Welcome to iPhone"
              aria-describedby="swipe-instruction"
              aria-hidden="true"
              tabindex="0"
            >
              <div class="greeting-stage">
                <p class="greeting" data-greeting>Hello</p>
              </div>

              <footer class="unlock-affordance">
                <p id="swipe-instruction" class="swipe-prompt" data-swipe-prompt>Swipe up to open</p>
                <div class="home-indicator" data-home-indicator aria-hidden="true"></div>
              </footer>
            </section>

            <section class="boot-screen safe-area-layer" data-boot-screen aria-label="Apple"><img src="../assets/Phone-UI/apple_logo.jpg" alt="Apple" draggable="false"></section>
          </main>

          <p class="visually-hidden" data-phase-announcement aria-live="polite">Starting iOS</p>
        </div>
      </div>
    </div>
  </body>
</html>
